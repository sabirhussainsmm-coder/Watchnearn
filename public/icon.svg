<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Central Video Player Frame -->
  <rect x="96" y="116" width="320" height="230" rx="32" fill="#111827" stroke="#374151" stroke-width="4" />
  
  <!-- Glowing Play Button -->
  <circle cx="256" cy="231" r="54" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <polygon points="244,207 282,231 244,255" fill="#0f172a" />
  
  <!-- Reward Coin Badge -->
  <circle cx="370" cy="140" r="38" fill="url(#goldGrad)" stroke="#111827" stroke-width="5" />
  <text x="370" y="152" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#111827" text-anchor="middle">₨</text>

  <!-- WatchNEarn Brand Bar -->
  <rect x="136" y="386" width="240" height="34" rx="17" fill="url(#emeraldGrad)" opacity="0.15" />
  <text x="256" y="410" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#10b981" letter-spacing="2" text-anchor="middle">WATCH·N·EARN</text>
  <text x="256" y="445" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#9ca3af" letter-spacing="1" text-anchor="middle">PAID VIDEO MICRO-TASKS</text>
</svg>
